; =============================================================
; DerbyTimer – PlatformIO project configuration
; =============================================================
; Two build environments, one per microcontroller.
;
; Common commands (run from repo root):
;   Build all:          pio run
;   Build one:          pio run -e startController
;   Upload:             pio run -e startController -t upload
;   Serial monitor:     pio device monitor -e startController
;   Clean:              pio run -t clean
; =============================================================

[platformio]
default_envs = startController, finishController
test_dir = firmware/test

; ── Shared settings for all environments ─────────────────────
[env]
monitor_speed  = 115200
lib_extra_dirs = firmware/lib   ; makes firmware/lib/shared available as a library
lib_ldf_mode   = deep+          ; follow #includes across library boundaries

; ── Start Controller ─────────────────────────────────────────
; Arduino Nano (ATmega328P, 5 V, 16 MHz)
; arduino-cli equivalent: --fqbn arduino:avr:nano
[env:startController]
platform  = atmelavr
board     = nanoatmega328new
framework = arduino
src_dir   = firmware/startController
build_flags =
    -I firmware/startController/src
    -I firmware/lib/shared

; ── Finish Controller ────────────────────────────────────────
; Arduino Nano 33 BLE (nRF52840, 3.3 V, 64 MHz)
; arduino-cli equivalent: --fqbn arduino:mbed_nano:nano33ble
[env:finishController]
platform  = nordicnrf52
board     = arduino_nano33ble
framework = arduino
src_dir   = firmware/finishController
build_flags =
    -I firmware/finishController/src
    -I firmware/lib/shared

; ── Native unit tests (desktop, no hardware) ─────────────────
; Run: pio test -e native
; Setup: see the L2 section of docs/testing.md
[env:native]
platform = native
test_build_src = no
build_flags =
    -I firmware/test/shared
    -I firmware/lib/shared
    -I firmware/startController/src
    -I firmware/finishController/src
    -DNATIVE_TEST
